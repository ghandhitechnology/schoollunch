name: Release Windows app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows_lunch_dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows_lunch_dist/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_app.py

  build-and-release:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows_lunch_dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows_lunch_dist/requirements.txt

      - name: Verify tag matches application version
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $version"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable
        run: |
          python generate_version_info.py
          python -m PyInstaller --noconfirm --clean windows_build.spec

      - name: Prepare release assets
        run: |
          New-Item -ItemType Directory -Force -Path ..\release | Out-Null
          Copy-Item "dist\하태욱 프로그램.exe" "..\release\hataewook-program-windows.exe"
          $hash = (Get-FileHash "..\release\hataewook-program-windows.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Resolve-Path "..\release").Path + "\hataewook-program-windows.exe.sha256",
            "$hash  hataewook-program-windows.exe`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "hataewook-program-windows.exe",
            "hataewook-program-windows.exe.sha256"
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets --verify-tag --generate-notes --title "하태욱 프로그램 $tag" --repo $env:GITHUB_REPOSITORY
          }
